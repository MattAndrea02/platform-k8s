#cloud-config
hostname: ${hostname}
manage_etc_hosts: false
ssh_pwauth: true
users:
  - name: ubuntu
    ssh_authorized_keys:
      - ${ssh_public_key}
    lock_passwd: false
    # the password is generated using: mkpasswd -m sha-512 "1234"
    passwd: $6$.NO1xMXBmPli7nXx$flG9pE.4yUaMKSIQ8w7yXWpxkXxXrfW7eUH7zTIT4wYR2WeVuV/14NEfPJqfwnI/BSjRt/DEn6eDcU8laaZ6Q1
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    shell: /bin/bash
    groups: wheel

disable_root: false
package_update: true
package_upgrade: true
packages:
  - curl
  - wget
  - apt-transport-https 
  - ca-certificates 
  - gpg
runcmd:
  - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  - echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.37/deb/ /' | sudo tee /etc/apt/sources.list.d/kubernetes.list
  - sudo apt-get update -y
  - sudo apt-get install kubelet kubeadm -y
  - sudo apt-mark hold kubelet kubeadm
  - sudo systemctl enable --now kubelet
  - sudo apt install containerd -y
