#cloud-config
hostname: ${hostname}
manage_etc_hosts: false
ssh_pwauth: true
users:
  - name: root
    ssh_authorized_keys:
      - ${ssh_public_key}
    lock_passwd: false
    passwd: $6$.NO1xMXBmPli7nXx$flG9pE.4yUaMKSIQ8w7yXWpxkXxXrfW7eUH7zTIT4wYR2WeVuV/14NEfPJqfwnI/BSjRt/DEn6eDcU8laaZ6Q1
    shell: /bin/bash
  - name: master
    ssh_authorized_keys:
      - ${ssh_public_key}
    lock_passwd: false
    # the password is generated using: mkpasswd -m sha-512 "1234"
    passwd: $6$.NO1xMXBmPli7nXx$flG9pE.4yUaMKSIQ8w7yXWpxkXxXrfW7eUH7zTIT4wYR2WeVuV/14NEfPJqfwnI/BSjRt/DEn6eDcU8laaZ6Q1
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    shell: /bin/bash
    groups: wheel

disable_root: false
chpasswd:
  expire: false
write_files:
  - path: /etc/ssh/sshd_config.d/00-root-login.conf
    owner: root:root
    permissions: '0644'
    content: |
      PermitRootLogin yes
      PasswordAuthentication yes
  - path: /etc/profile.d/kubernetes.sh
    owner: root:root
    permissions: '0644'
    content: |
      if [ "$(id -u)" -eq 0 ]; then
        export KUBECONFIG=/etc/kubernetes/admin.conf
      fi
package_update: true
package_upgrade: true
packages:
  - curl
  - wget
  - apt-transport-https 
  - ca-certificates 
  - gpg 
runcmd:
  - [sh, -c, 'sshd -t && systemctl relod ssh']
  - curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  - echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.37/deb/ /' | sudo tee /etc/apt/sources.list.d/kubernetes.list
  - sudo apt-get update -y
  - sudo apt-get install kubelet kubeadm kubectl -y
  - sudo apt-mark hold kubelet kubeadm kubectl
  - sudo systemctl enable --now kubelet
  - echo "net.ipv4.ip_forward = 1" | sudo tee /etc/sysctl.d/99-ip-forward.conf   
  - sysctl --system
  - sudo apt-get install containerd -y
  - kubeadm init --pod-network-cidr=10.244.0.0/16
