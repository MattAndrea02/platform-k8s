apiVersion: v1
kind: Service
metadata:
  name: platform-api-service-k8s
  namespace: backend
  labels:
    name: platform-api-service-k8s
spec:
  selector:
    app: platform-api-k8s
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api-k8s
  namespace: backend
spec:
  selector:
    matchLabels:
      app: platform-api-k8s
  replicas: 1
  template:
    metadata:
      labels:
        app: platform-api-k8s
    spec:
      containers:
        - name: platform-api-k8s
          image: platform-api-k8s:1.0
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: postgres_user
                  name: database-credentials
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: postgres_password
