apiVersion: v1
kind: Service
metadata:
  name: platform-api-service-k8s
  namespace: backend
  labels:
    name: platform-api-service-k8s
spec:
  selector:
    app: platform-api-k8s
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: platform-k8s-test-service
  namespace: backend
spec:
  type: NodePort
  selector:
    app: platform-api-k8s
  ports:
  - port: 4000
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api-k8s
  namespace: backend
spec:
  selector:
    matchLabels:
      app: platform-api-k8s
  replicas: 1
  template:
    metadata:
      labels:
        app: platform-api-k8s
    spec:
      containers:
        - name: platform-api-k8s
          image: platform-api-k8s:1.0
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_USER
                  name: database-credentials
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: POSTGRES_PASSWORD
          initContainers:
          - name: wait-for-postgres
            image: postgres:16-alpine
            command: ['sh', '-c']
            args:
              - until pg_isready -h $DB_HOST -p 5432 -U $POSTGRES_USER -d $POSTGRES_DB; do echo "Waiting for PostgreSQL"; sleep 2; done
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10