apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: postgres
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -ec
                  - sleep 20 && PGPASSWORD="$POSTGRES_PASSWORD" psql -w -d "$POSTGRES_DB" -U "$POSTGRES_USER" -v ON_ERROR_STOP=1 -f /etc/database-config/initdb.sql

          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: POSTGRES_PASSWORD
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: database-config
                  key: POSTGRES_USER
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: database-init
              mountPath: /etc/database-config
              readOnly: true
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: database-init
          configMap:
            name: database-config
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
