---
- name: Configure the Kubernetes control plane
  hosts: control_plane
  become: true

  tasks:
    - name: Set the control-plane hostname
      ansible.builtin.hostname:
        name: "{{ control_plane_hostname }}"

    - name: Install prerequisites
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the administrator group
      ansible.builtin.group:
        name: "{{ control_plane_group }}"

    - name: Configure root and administrator accounts
      ansible.builtin.user:
        name: "{{ item }}"
        password: "{{ user_password_hash }}"
        password_lock: false
        password_expire_max: -1
        shell: /bin/bash
        groups: "{{ control_plane_group if item != 'root' else omit }}"
        append: "{{ item != 'root' }}"
      loop: "{{ ['root', control_plane_user] | unique }}"
      no_log: true

    - name: Authorize the SSH public key
      ansible.posix.authorized_key:
        user: "{{ item }}"
        key: "{{ ssh_public_key }}"
      loop: "{{ ['root', control_plane_user] | unique }}"

    - name: Allow passwordless sudo for the administrator
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ control_plane_user }}"
        content: "{{ control_plane_user }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    - name: Configure SSH login
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-root-login.conf
        content: |
          PermitRootLogin {{ ssh_permit_root_login }}
          PasswordAuthentication {{ ssh_password_authentication }}
        owner: root
        group: root
        mode: '0644'
      notify: Reload SSH

    - name: Create the APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download the Kubernetes signing key
      ansible.builtin.get_url:
        url: "{{ kubernetes_repository }}Release.key"
        dest: /etc/apt/keyrings/kubernetes.asc
        mode: '0644'

    - name: Configure the Kubernetes APT repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] {{ kubernetes_repository }} /\n"
        owner: root
        group: root
        mode: '0644'
      register: kubernetes_repository_config

    - name: Install Kubernetes
      ansible.builtin.apt:
        name: "{{ kubernetes_packages }}"
        state: present
        update_cache: "{{ kubernetes_repository_config.changed }}"

    - name: Hold Kubernetes package versions
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ kubernetes_packages }}"

    - name: Enable IPv4 forwarding immediately and persistently
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_file: /etc/sysctl.d/99-ip-forward.conf
        sysctl_set: true

    - name: Configure kubelet arguments
      ansible.builtin.lineinfile:
        path: /etc/default/kubelet
        regexp: '^KUBELET_EXTRA_ARGS='
        line: 'KUBELET_EXTRA_ARGS="--fail-swap-on={{ kubelet_fail_swap_on | bool | ternary("true", "false") }}{% if kubelet_extra_args %} {{ kubelet_extra_args }}{% endif %}"'
        create: true
        owner: root
        group: root
        mode: '0644'
      notify: Restart kubelet

    - name: Enable and start containerd before kubelet
      ansible.builtin.systemd_service:
        name: containerd
        enabled: true
        state: started

    - name: Apply configuration before starting the control plane
      ansible.builtin.meta: flush_handlers

    - name: Enable and start kubelet
      ansible.builtin.systemd_service:
        name: kubelet
        enabled: true
        state: started

    - name: Initialize a new control plane
      ansible.builtin.command:
        argv:
          - kubeadm
          - init
          - "--pod-network-cidr={{ pod_network_cidr }}"
          - "--cri-socket={{ container_runtime_endpoint }}"
        creates: /etc/kubernetes/admin.conf

    - name: Verify control-plane initialization
      when: not ansible_check_mode
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      block:
        - name: Wait for the API server to be ready
          ansible.builtin.command:
            cmd: kubectl --request-timeout=5s get --raw=/readyz
          register: api_ready
          changed_when: false
          retries: 12
          delay: 5
          until: api_ready.rc == 0

        - name: Verify administrator permissions
          ansible.builtin.command:
            cmd: kubectl --request-timeout=10s auth can-i '*' '*' --all-namespaces --quiet
          changed_when: false

        - name: Verify kubeadm addons exist
          ansible.builtin.command:
            cmd: kubectl --request-timeout=10s -n kube-system get deployment/coredns daemonset/kube-proxy
          changed_when: false

      rescue:
        - name: Report incomplete initialization
          ansible.builtin.fail:
            msg: >-
              Control-plane verification failed at '{{ ansible_failed_task.name }}'.
              admin.conf alone does not prove kubeadm init completed.
              Check kubelet logs and the failed check above before resuming
              missing kubeadm phases on this existing cluster.

    - name: Set the root Kubernetes configuration for login shells
      ansible.builtin.copy:
        dest: /etc/profile.d/kubernetes.sh
        content: |
          if [ "$(id -u)" -eq 0 ]; then
            export KUBECONFIG=/etc/kubernetes/admin.conf
          fi
        owner: root
        group: root
        mode: '0644'

    - name: Set the root Kubernetes configuration for interactive Bash shells
      ansible.builtin.blockinfile:
        path: /root/.bashrc
        create: true
        owner: root
        group: root
        mode: '0644'
        marker: "# {mark} ANSIBLE MANAGED KUBECONFIG"
        block: |
          export KUBECONFIG=/etc/kubernetes/admin.conf

  handlers:
    - name: Reload SSH
      ansible.builtin.shell:
        cmd: /usr/sbin/sshd -t && systemctl reload ssh

    - name: Restart kubelet
      ansible.builtin.systemd_service:
        name: kubelet
        daemon_reload: true
        state: restarted
